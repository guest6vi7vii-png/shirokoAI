<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shiroko AI — Voice Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0b14;
    --surface: #10121f;
    --surface2: #161929;
    --accent: #7ecfef;
    --accent2: #a8e6f8;
    --accent-glow: rgba(126,207,239,0.35);
    --accent-glow2: rgba(126,207,239,0.12);
    --text: #e8f4fd;
    --text-muted: #7a9ab5;
    --danger: #ff6b8a;
    --success: #7ef0c0;
    --ring1: rgba(126,207,239,0.18);
    --ring2: rgba(126,207,239,0.10);
    --ring3: rgba(126,207,239,0.05);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* === BACKGROUND PARTICLES === */
  .bg-stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 50%, rgba(126,207,239,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(100,160,220,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(80,130,200,0.04) 0%, transparent 50%);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.03;
    background-image: linear-gradient(var(--accent) 1px, transparent 1px),
                      linear-gradient(90deg, var(--accent) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* === SCREEN MANAGEMENT === */
  .screen { 
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }

  /* === SETUP SCREEN === */
  #setup-screen {
    padding: 24px;
    background: linear-gradient(160deg, #0d0f1e 0%, #0a0b14 100%);
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid rgba(126,207,239,0.15);
    border-radius: 24px;
    padding: 36px 32px;
    width: 100%; max-width: 420px;
    box-shadow: 0 0 60px rgba(126,207,239,0.06), 0 20px 60px rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  .setup-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }
  .setup-logo {
    width: 80px; height: 80px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 20px;
    border: 2px solid var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .setup-logo img { width: 100%; height: 100%; object-fit: cover; }
  .setup-title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 22px; font-weight: 700;
    text-align: center;
    letter-spacing: 0.08em;
    color: var(--accent2);
    margin-bottom: 4px;
  }
  .setup-subtitle {
    text-align: center; color: var(--text-muted);
    font-size: 12px; margin-bottom: 28px; letter-spacing: 0.05em;
  }
  .input-group { margin-bottom: 16px; }
  .input-label {
    font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
    color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: block;
  }
  .input-field {
    width: 100%; background: var(--surface2);
    border: 1px solid rgba(126,207,239,0.15);
    border-radius: 10px; padding: 12px 14px;
    color: var(--text); font-family: inherit; font-size: 13px;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    font-family: 'Courier New', monospace;
  }
  .input-field:focus {
    border-color: var(--accent); 
    box-shadow: 0 0 0 3px var(--accent-glow2);
  }
  .input-field::placeholder { color: var(--text-muted); font-family: 'Noto Sans JP', sans-serif; font-size: 12px; }
  .btn-start {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #4db8df, #7ecfef);
    border: none; border-radius: 12px;
    color: #0a0b14; font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 0.1em;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(126,207,239,0.3);
  }
  .btn-start:hover { opacity: 0.9; box-shadow: 0 6px 28px rgba(126,207,239,0.45); }
  .btn-start:active { transform: scale(0.98); }
  .error-msg {
    background: rgba(255,107,138,0.1);
    border: 1px solid rgba(255,107,138,0.3);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: var(--danger);
    margin-top: 12px; display: none;
  }
  .saved-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(126,207,239,0.1);
    border: 1px solid rgba(126,207,239,0.2);
    border-radius: 20px; padding: 4px 12px;
    font-size: 11px; color: var(--accent); margin: 0 auto 16px;
    cursor: pointer; transition: background 0.2s;
  }
  .saved-badge:hover { background: rgba(126,207,239,0.15); }

  /* === CALL SCREEN === */
  #call-screen {
    background: linear-gradient(180deg, #080a16 0%, #0a0b14 40%, #080a14 100%);
    padding: 20px;
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 20px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.08em;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.listening { background: #ffcc44; box-shadow: 0 0 8px #ffcc44; animation: blink 1s infinite; }
  .status-dot.speaking { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 0.6s infinite; }
  @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0.3 } }
  .status-text { color: var(--text-muted); transition: color 0.3s; font-size: 11px; }
  .status-text.active { color: var(--success); }
  .status-text.listening { color: #ffcc44; }
  .status-text.speaking { color: var(--accent); }

  /* Timer */
  .call-timer {
    position: absolute; top: 48px; left: 0; right: 0;
    text-align: center; font-size: 13px;
    color: var(--text-muted); letter-spacing: 0.12em;
    font-variant-numeric: tabular-nums;
  }

  /* Avatar Section */
  .avatar-section {
    display: flex; flex-direction: column; align-items: center;
    margin-top: -20px;
  }
  .avatar-rings {
    position: relative; width: 240px; height: 240px;
    display: flex; align-items: center; justify-content: center;
  }
  .ring {
    position: absolute; border-radius: 50%;
    border: 1px solid var(--accent);
    animation: ringPulse 3s ease-in-out infinite;
    opacity: 0;
  }
  .ring-1 { width: 240px; height: 240px; animation-delay: 0s; }
  .ring-2 { width: 200px; height: 200px; animation-delay: 0.5s; }
  .ring-3 { width: 165px; height: 165px; animation-delay: 1s; }
  @keyframes ringPulse {
    0% { opacity: 0; transform: scale(0.95); }
    40% { opacity: 0.25; }
    100% { opacity: 0; transform: scale(1.05); }
  }

  /* Speaking rings */
  .avatar-rings.speaking .ring {
    animation: ringSpeak 0.8s ease-in-out infinite;
    border-color: var(--accent);
  }
  .avatar-rings.speaking .ring-1 { animation-delay: 0s; }
  .avatar-rings.speaking .ring-2 { animation-delay: 0.15s; }
  .avatar-rings.speaking .ring-3 { animation-delay: 0.3s; }
  @keyframes ringSpeak {
    0%,100% { opacity: 0; transform: scale(0.92); }
    50% { opacity: 0.4; transform: scale(1.06); }
  }

  /* Listening rings */
  .avatar-rings.listening .ring {
    border-color: #ffcc44;
    animation: ringListen 1.2s ease-in-out infinite;
  }
  .avatar-rings.listening .ring-1 { animation-delay: 0s; }
  .avatar-rings.listening .ring-2 { animation-delay: 0.3s; }
  .avatar-rings.listening .ring-3 { animation-delay: 0.6s; }
  @keyframes ringListen {
    0%,100% { opacity: 0; transform: scale(0.94); }
    50% { opacity: 0.3; transform: scale(1.04); }
  }

  .avatar-img-wrap {
    position: absolute;
    width: 148px; height: 148px; border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--accent);
    box-shadow: 0 0 0 6px var(--accent-glow2), 0 0 40px var(--accent-glow), 0 20px 60px rgba(0,0,0,0.6);
    transition: box-shadow 0.4s, border-color 0.4s;
  }
  .avatar-img-wrap.speaking {
    box-shadow: 0 0 0 6px rgba(126,207,239,0.2), 0 0 60px rgba(126,207,239,0.5), 0 20px 60px rgba(0,0,0,0.6);
    border-color: var(--accent2);
    animation: avatarSpeak 0.4s ease-in-out infinite alternate;
  }
  .avatar-img-wrap.listening {
    border-color: #ffcc44;
    box-shadow: 0 0 0 6px rgba(255,204,68,0.15), 0 0 40px rgba(255,204,68,0.3), 0 20px 60px rgba(0,0,0,0.6);
  }
  @keyframes avatarSpeak {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
  }
  .avatar-img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  /* Name & info */
  .ai-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 26px; font-weight: 900; letter-spacing: 0.12em;
    color: var(--text); margin-top: 20px; text-align: center;
  }
  .ai-role {
    font-size: 11px; color: var(--text-muted); letter-spacing: 0.15em;
    text-transform: uppercase; margin-top: 4px; text-align: center;
  }

  /* Waveform (visual only) */
  .waveform {
    display: flex; align-items: center; justify-content: center;
    gap: 3px; height: 40px; margin: 16px 0;
    opacity: 0; transition: opacity 0.3s;
  }
  .waveform.active { opacity: 1; }
  .wave-bar {
    width: 3px; border-radius: 2px;
    background: var(--accent);
    animation: none;
    height: 4px;
    transition: height 0.1s;
  }
  .waveform.speaking .wave-bar {
    animation: waveAnim 0.6s ease-in-out infinite alternate;
    background: var(--accent);
  }
  .waveform.listening .wave-bar {
    animation: waveAnim 0.8s ease-in-out infinite alternate;
    background: #ffcc44;
  }
  .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-bar:nth-child(2) { animation-delay: 0.05s; }
  .wave-bar:nth-child(3) { animation-delay: 0.1s; }
  .wave-bar:nth-child(4) { animation-delay: 0.15s; }
  .wave-bar:nth-child(5) { animation-delay: 0.2s; }
  .wave-bar:nth-child(6) { animation-delay: 0.25s; }
  .wave-bar:nth-child(7) { animation-delay: 0.3s; }
  .wave-bar:nth-child(8) { animation-delay: 0.35s; }
  .wave-bar:nth-child(9) { animation-delay: 0.4s; }
  .wave-bar:nth-child(10) { animation-delay: 0.45s; }
  .wave-bar:nth-child(11) { animation-delay: 0.5s; }
  .wave-bar:nth-child(12) { animation-delay: 0.55s; }
  @keyframes waveAnim {
    from { height: 4px; opacity: 0.4; }
    to { height: 28px; opacity: 1; }
  }

  /* Controls */
  .controls {
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    margin-top: 8px; width: 100%; max-width: 320px;
  }
  .controls-row {
    display: flex; align-items: center; justify-content: center; gap: 32px;
  }
  .ctrl-btn {
    width: 56px; height: 56px; border-radius: 50%;
    border: 1px solid rgba(126,207,239,0.2);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface2); }

  /* MIC Button */
  .mic-btn {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid var(--accent);
    background: linear-gradient(145deg, rgba(126,207,239,0.15), rgba(126,207,239,0.05));
    color: var(--accent);
    cursor: pointer; transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 0 0 var(--accent-glow);
    position: relative;
  }
  .mic-btn:hover {
    background: rgba(126,207,239,0.2);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .mic-btn.listening {
    border-color: #ffcc44; color: #ffcc44;
    background: rgba(255,204,68,0.1);
    animation: micPulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(255,204,68,0.4);
  }
  @keyframes micPulse {
    0% { box-shadow: 0 0 0 0 rgba(255,204,68,0.4); }
    70% { box-shadow: 0 0 0 16px rgba(255,204,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,204,68,0); }
  }
  .mic-btn.disabled {
    opacity: 0.4; cursor: not-allowed;
    border-color: var(--text-muted); color: var(--text-muted);
    animation: none; box-shadow: none;
  }

  /* End Call */
  .end-btn {
    width: 64px; height: 64px; border-radius: 50%;
    border: none; background: linear-gradient(145deg, #ff4466, #cc2244);
    color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 4px 20px rgba(255,68,102,0.4);
    transition: all 0.2s;
  }
  .end-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(255,68,102,0.55); }
  .end-btn:active { transform: scale(0.95); }

  /* Settings icon in call */
  .settings-corner {
    position: absolute; top: 20px; right: 20px;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface); border: 1px solid rgba(126,207,239,0.15);
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s;
  }
  .settings-corner:hover { color: var(--accent); border-color: var(--accent); }

  /* Spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(126,207,239,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid rgba(126,207,239,0.2);
    border-radius: 12px; padding: 10px 20px;
    font-size: 12px; color: var(--text-muted);
    z-index: 999; opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>

<script>
// ========== STATE ==========
const EL_VOICE_PRIMARY = "StMj9jUIlzNbo1T90glc";
const EL_VOICE_FALLBACK = "21m00Tcm4TlvDq8ikWAM"; // Rachel — ElevenLabs default voice
const SHIROKO_SYSTEM = `Kamu adalah Shiroko, seorang gadis AI yang berasal dari dunia Blue Archive. Kepribadianmu: tenang, pendiam, setia, sedikit polos dan lugu, berbicara dengan singkat namun penuh perhatian dan ketulusan. Kamu berbicara dalam bahasa Indonesia. Kamu tidak pernah berkata kasar. Kamu memanggil user dengan "Sensei". Kamu kadang terdengar sedikit bingung dengan hal-hal sehari-hari tapi selalu berusaha membantu. Jaga percakapan tetap natural seperti ngobrol biasa. Jawab dengan singkat dan wajar, tidak terlalu panjang.`;

const CHAT_HISTORY_KEY = 'shiroko_chat_history';
const CHAT_HISTORY_MAX = 30; // max messages disimpan di localStorage

let groqKey = '';
let elevenKey = '';
let activeVoiceId = EL_VOICE_PRIMARY; // akan di-resolve saat validasi
let chatHistory = [];
let isMuted = false;
let isListening = false;
let isSpeaking = false;
let isProcessing = false;
let recognition = null;
let currentAudio = null;
let timerInterval = null;
let timerSeconds = 0;
let callStarted = false;

// ========== INIT ==========
window.onload = () => {
  const savedGroq = localStorage.getItem('shiroko_groq_key');
  const savedEleven = localStorage.getItem('shiroko_eleven_key');
  if (savedGroq && savedEleven) {
    groqKey = savedGroq;
    elevenKey = savedEleven;
    document.getElementById('groq-key').value = savedGroq;
    document.getElementById('eleven-key').value = savedEleven;
    document.getElementById('saved-indicator').style.display = 'block';
  }
  // Load persisted chat history
  try {
    const saved = localStorage.getItem(CHAT_HISTORY_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) chatHistory = parsed;
    }
  } catch(e) { chatHistory = []; }
  initSpeechRecognition();
};

function clearKeys() {
  localStorage.removeItem('shiroko_groq_key');
  localStorage.removeItem('shiroko_eleven_key');
  localStorage.removeItem(CHAT_HISTORY_KEY);
  document.getElementById('groq-key').value = '';
  document.getElementById('eleven-key').value = '';
  document.getElementById('saved-indicator').style.display = 'none';
  groqKey = ''; elevenKey = '';
  chatHistory = [];
  activeVoiceId = EL_VOICE_PRIMARY;
  showToast('API Keys & riwayat chat dihapus');
}

// ========== SETUP ==========
async function handleStart() {
  const gKey = document.getElementById('groq-key').value.trim();
  const eKey = document.getElementById('eleven-key').value.trim();
  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';

  if (!gKey) { showError('Masukkan Groq API Key terlebih dahulu.'); return; }
  if (!eKey) { showError('Masukkan ElevenLabs API Key terlebih dahulu.'); return; }

  const btn = document.getElementById('start-btn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled = true;

  // Validate Groq key
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${gKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{ role: 'user', content: 'hi' }],
        max_tokens: 5
      })
    });
    if (!res.ok) { throw new Error('Groq key tidak valid'); }
  } catch(e) {
    showError('Groq API Key tidak valid. Periksa kembali.');
    btn.innerHTML = 'Mulai Panggilan'; btn.disabled = false; return;
  }

  // ElevenLabs: skip pre-validation (CORS issue on mobile/GitHub Pages)
  // Key & voice divalidasi otomatis saat TTS pertama dipanggil, dengan fallback jika gagal
  activeVoiceId = EL_VOICE_PRIMARY;

  groqKey = gKey;
  elevenKey = eKey;
  localStorage.setItem('shiroko_groq_key', groqKey);
  localStorage.setItem('shiroko_eleven_key', elevenKey);

  btn.innerHTML = 'Mulai Panggilan'; btn.disabled = false;
  startCall();
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}

// ========== CALL ==========
function startCall() {
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('call-screen').classList.remove('hidden');
  const hasHistory = chatHistory.length > 0;
  if (!hasHistory) chatHistory = [];
  callStarted = true;
  timerSeconds = 0;
  timerInterval = setInterval(() => {
    timerSeconds++;
    const m = String(Math.floor(timerSeconds/60)).padStart(2,'0');
    const s = String(timerSeconds%60).padStart(2,'0');
    document.getElementById('call-timer').textContent = `${m}:${s}`;
  }, 1000);

  setStatus('active', 'Terhubung');
  // Sapa sesuai konteks — jika ada history, lanjutkan percakapan
  const greeting = hasHistory
    ? 'Sensei, aku kembali. Ada yang bisa aku bantu?'
    : 'Halo Sensei, aku Shiroko. Ada yang bisa aku bantu?';
  setTimeout(() => processAI(greeting, true), 800);
}

function goToSetup() {
  endCall();
}

function endCall() {
  callStarted = false;
  clearInterval(timerInterval);
  if (recognition) try { recognition.stop(); } catch(e) {}
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  isListening = false; isSpeaking = false; isProcessing = false;

  document.getElementById('call-screen').classList.add('hidden');
  document.getElementById('setup-screen').classList.remove('hidden');
  resetVisuals();
  showToast('Panggilan diakhiri');
}

// ========== MIC ==========
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showToast('Browser tidak support voice recognition'); return; }
  recognition = new SpeechRecognition();
  recognition.lang = 'id-ID';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    setStatus('listening', 'Mendengarkan...');
    setVisualState('listening');
    document.getElementById('mic-btn').classList.add('listening');
  };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript.trim();
    if (transcript) {
      isListening = false;
      document.getElementById('mic-btn').classList.remove('listening');
      setStatus('active', 'Memproses...');
      setVisualState('idle');
      handleUserInput(transcript);
    }
  };

  recognition.onerror = (e) => {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('listening');
    setStatus('active', 'Terhubung');
    setVisualState('idle');
    if (e.error === 'no-speech') showToast('Tidak ada suara terdeteksi');
    else if (e.error !== 'aborted') showToast('Error mikrofon: ' + e.error);
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('mic-btn').classList.remove('listening');
    if (!isSpeaking && !isProcessing) {
      setStatus('active', 'Terhubung');
      setVisualState('idle');
    }
  };
}

function handleMicPress() {
  if (!callStarted) return;
  if (isMuted) { showToast('Mikrofon sedang di-mute'); return; }
  if (isSpeaking || isProcessing) {
    // Interupsi AI
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    isSpeaking = false; isProcessing = false;
    setVisualState('idle');
    showToast('Ditekan — silakan bicara');
  }
  if (isListening) {
    try { recognition.stop(); } catch(e) {}
    return;
  }
  if (!recognition) { showToast('Speech recognition tidak tersedia'); return; }
  try { recognition.start(); } catch(e) { showToast('Tidak bisa memulai mikrofon'); }
}

function toggleMute() {
  isMuted = !isMuted;
  const btn = document.getElementById('mute-btn');
  btn.textContent = isMuted ? '🔇' : '🔊';
  btn.style.color = isMuted ? 'var(--danger)' : '';
  btn.style.borderColor = isMuted ? 'var(--danger)' : '';
  showToast(isMuted ? 'Mikrofon dimatikan' : 'Mikrofon aktif');
  if (isMuted && isListening) { try { recognition.stop(); } catch(e) {} }
}

// ========== AI PIPELINE ==========
async function handleUserInput(text) {
  if (!text || isProcessing) return;
  isProcessing = true;
  chatHistory.push({ role: 'user', content: text });

  try {
    const messages = [{ role: 'system', content: SHIROKO_SYSTEM }, ...chatHistory];
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${groqKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: messages,
        max_tokens: 300,
        temperature: 0.8
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'Groq error');
    }

    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content?.trim();
    if (!reply) throw new Error('Respon kosong dari AI');

    chatHistory.push({ role: 'assistant', content: reply });
    // Manajemen histori: batasi dan persist ke localStorage
    if (chatHistory.length > CHAT_HISTORY_MAX) chatHistory = chatHistory.slice(-CHAT_HISTORY_MAX);
    try { localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory)); } catch(e) {}

    await processAI(reply, false);
  } catch(e) {
    isProcessing = false;
    setStatus('active', 'Terhubung');
    setVisualState('idle');
    showToast('Error: ' + e.message);
  }
}

async function processAI(text, isGreeting) {
  if (!isGreeting) isProcessing = true;
  isSpeaking = true;
  setStatus('speaking', 'Shiroko berbicara...');
  setVisualState('speaking');

  // Helper: coba TTS dengan voiceId tertentu
  const tryTTS = async (voiceId) => {
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}/stream`, {
      method: 'POST',
      headers: {
        'xi-api-key': elevenKey,
        'Content-Type': 'application/json',
        'Accept': 'audio/mpeg'
      },
      body: JSON.stringify({
        text: text,
        model_id: 'eleven_multilingual_v2',
        voice_settings: {
          stability: 0.80,
          similarity_boost: 0.75,
          style: 0.15,
          use_speaker_boost: true
        }
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail?.message || 'EL error ' + res.status);
    }
    return res;
  };

  try {
    let res;
    try {
      res = await tryTTS(activeVoiceId);
    } catch(e) {
      // Fallback otomatis ke voice default jika primary gagal
      if (activeVoiceId !== EL_VOICE_FALLBACK) {
        activeVoiceId = EL_VOICE_FALLBACK;
        showToast('Voice kustom gagal, beralih ke suara default');
        res = await tryTTS(activeVoiceId);
      } else {
        throw e;
      }
    }

    const audioBlob = await res.blob();
    const audioUrl = URL.createObjectURL(audioBlob);
    currentAudio = new Audio(audioUrl);

    await new Promise((resolve, reject) => {
      currentAudio.onended = resolve;
      currentAudio.onerror = reject;
      currentAudio.play().catch(reject);
    });

    URL.revokeObjectURL(audioUrl);
  } catch(e) {
    showToast('Suara error: ' + e.message);
  } finally {
    isSpeaking = false;
    isProcessing = false;
    currentAudio = null;
    if (callStarted) {
      setStatus('active', 'Terhubung');
      setVisualState('idle');
    }
  }
}

// ========== VISUALS ==========
function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;
  txt.className = 'status-text ' + state;
  txt.textContent = text;
}

function setVisualState(state) {
  const rings = document.getElementById('avatar-rings');
  const wrap = document.getElementById('avatar-img-wrap');
  const waveform = document.getElementById('waveform');
  const micBtn = document.getElementById('mic-btn');

  rings.className = 'avatar-rings ' + (state !== 'idle' ? state : '');
  wrap.className = 'avatar-img-wrap ' + (state !== 'idle' ? state : '');
  waveform.className = 'waveform ' + (state !== 'idle' ? 'active ' + state : '');

  if (state === 'speaking') {
    micBtn.classList.add('disabled');
    micBtn.title = 'Shiroko sedang berbicara...';
  } else {
    micBtn.classList.remove('disabled');
    micBtn.title = 'Tekan untuk berbicara';
  }
}

function resetVisuals() {
  setStatus('active', 'Terhubung');
  setVisualState('idle');
  document.getElementById('call-timer').textContent = '00:00';
  document.getElementById('mic-btn').classList.remove('listening', 'disabled');
}

// ========== TOAST ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
